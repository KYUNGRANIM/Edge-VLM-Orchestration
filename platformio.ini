[platformio]
default_envs = M5_A, M5_B, M5_C
; MEDIC rerun (revision, routers retrained on the corrected severity labels). EIDSeg runtime used
; revision/eidseg/runtime/firmware with RUN_ID eidseg_runtime600, RUN_START 150, RUN_END 600 (final batch);
; EIDSeg collection used revision/eidseg/firmware with RUN_ID eidseg_full; the first MEDIC run used revision/first_submission/m5_firmware.
src_dir = deployment/m5_firmware

[env]
platform = espressif32
board = m5stack-cores3
framework = arduino
monitor_speed = 115200

lib_deps =
  m5stack/M5Unified
  m5stack/M5Module-LLM
  m5stack/M5CoreS3
  bblanchon/ArduinoJson
  bitbank2/JPEGDEC
  bitbank2/JPEGENC

; Wi-Fi credentials are read from the environment so they never enter version
; control. Export them before building, e.g.
;   export M5_WIFI_SSID="my-network"
;   export M5_WIFI_PASS="my-password"
; If unset, the fallback placeholders in config.h are used and the board will
; not associate.
build_flags =
  -D WIFI_SSID=\"${sysenv.M5_WIFI_SSID}\"
  -D WIFI_PASS=\"${sysenv.M5_WIFI_PASS}\"
  -D PI_HOST=\"192.168.0.60\"
  -D PI_PORT=8000
  -D PI_ENDPOINT_INGEST=\"/ingest_m5\"
  -D PI_COORD_PORT=8000
  -D PI_ENDPOINT_FINAL_ROUTE=\"/ingest_final_route\"
  -D RUN_ID=\"medic_rerun600\"
  ; 2026-11-02: run 50 images at a time. Flash all three with the same range; each flash restarts the range.
  -D RUN_START=0
  -D RUN_END=600
  ; 2026-11-02: progress signal to the Jetson watchdog (revision/eidseg/code/m5_heartbeat_server.py)
  -D HB_HOST=\"192.168.0.92\"
  -D HB_PORT=8020
  ; optional: pin the router's BSSID (the run pinned the lab router because a hotspot with the same SSID took M5_B off the LAN)
  ; -D WIFI_BSSID=0x00,0x00,0x00,0x00,0x00,0x00
  -D ARDUINO_LOOP_STACK_SIZE=32768

[env:M5_A]
upload_port = /dev/cu.usbmodem101
monitor_port = /dev/cu.usbmodem101
build_flags =
  ${env.build_flags}
  -D DEVICE_NAME=\"M5_A\"
  ; 2026-11-02: fixed addresses (a second router on the LAN answers DHCP first; see tier1.cpp WIFI_BEGIN)
  -D M5_STATIC_IP=192,168,0,240
  -D M5A_HOST=\"192.168.0.240\"
  -D M5A_PORT=8010

[env:M5_B]
upload_port = /dev/cu.usbmodem112101
monitor_port = /dev/cu.usbmodem112101
build_flags =
  ${env.build_flags}
  -D DEVICE_NAME=\"M5_B\"
  ; 2026-11-02: fixed addresses (a second router on the LAN answers DHCP first; see tier1.cpp WIFI_BEGIN)
  -D M5_STATIC_IP=192,168,0,241
  -D M5A_HOST=\"192.168.0.240\"
  -D M5A_PORT=8010

[env:M5_C]
upload_port = /dev/cu.usbmodem11301
monitor_port = /dev/cu.usbmodem11301
build_flags =
  ${env.build_flags}
  -D DEVICE_NAME=\"M5_C\"
  ; 2026-11-02: fixed addresses (a second router on the LAN answers DHCP first; see tier1.cpp WIFI_BEGIN)
  -D M5_STATIC_IP=192,168,0,242
  -D M5A_HOST=\"192.168.0.240\"
  -D M5A_PORT=8010
